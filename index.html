<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VORAX CONNECT</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:30px}
h1{color:red;letter-spacing:2px}
input{padding:15px;width:85%;max-width:320px;border-radius:10px;border:none;font-size:16px;text-align:center}
button{background:red;color:#fff;padding:15px 35px;border:none;border-radius:10px;font-weight:bold;margin-top:15px;font-size:16px;cursor:pointer}
#code{margin-top:30px;letter-spacing:5px;color:#ff0000;font-size:32px;font-weight:bold}
#info{color:#aaa;margin-top:15px}
.box{border:1px solid #222;padding:20px;border-radius:15px;margin-top:20px}
</style>
</head>
<body>
<h1>VORAX CONNECT</h1>
<p>Entre ton numéro WhatsApp avec l'indicatif</p>

<input id="num" placeholder="+2250700000000"><br>
<button onclick="getCode()">OBTENIR LE CODE</button>

<div class="box">
<h2 id="code"></h2>
<p id="info">Le code s'affiche ici</p>
</div>

<p style="margin-top:40px;font-size:12px;color:#555">By VORAX - Location 1h - Abidjan</p>

<script>
async function getCode(){
  const num=document.getElementById('num').value.replace(/[^0-9]/g,'');
  if(!num){alert('Mets ton numéro');return;}
  document.getElementById('info').innerText='Génération en cours...';
  try{
    const r=await fetch('/code?number='+num);
    const d=await r.json();
    if(d.code){
      document.getElementById('code').innerText=d.code;
      document.getElementById('info').innerText='Va dans WhatsApp > Appareils liés > Lier avec numéro de téléphone. Valable 1h.';
    } else {
      document.getElementById('info').innerText='Erreur: '+d.error;
    }
  }catch(e){
    document.getElementById('info').innerText='Erreur serveur';
  }
}
</script>
</body>
  </html>
